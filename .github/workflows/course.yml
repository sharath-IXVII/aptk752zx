name: Course chapter

# Renders the next chapter listed in gptk755blend/studio/explainer/episodes/network/order.json
# (theory chapters, then the numericals). A reviewer AI checks it first; it is rendered with the channel
# intro/outro and uploaded to its playlist, scheduled one chapter a day (7:30 PM IST).
on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Make this chapter public at once (instead of scheduling)"
        type: boolean
        default: false

concurrency: {group: course, cancel-in-progress: false}
permissions: {contents: write, issues: write}

jobs:
  chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: sharath11yr/gptk755blend, path: blend}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Next chapter
        id: ep
        run: |
          pip install -q python-dotenv google-api-python-client google-auth httpx
          e=$(python -m pipeline.course next blend/studio/explainer/episodes/network/order.json)
          echo "ep=$e" >> $GITHUB_OUTPUT; echo "next: ${e:-none}"
      - name: Reviewer AI checks and fixes the chapter (stops only if it cannot fix it)
        id: review
        if: steps.ep.outputs.ep != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m pipeline.course_review "blend/studio/explainer/episodes/${{ steps.ep.outputs.ep }}"
      - uses: actions/setup-node@v4
        if: steps.ep.outputs.ep != ''
        with: {node-version: 22}
      - name: Render
        if: steps.ep.outputs.ep != ''
        working-directory: blend/studio/explainer
        run: |
          EP="episodes/${{ steps.ep.outputs.ep }}"
          npm ci || npm install
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q edge-tts "kokoro>=0.9.4" soundfile
          python voice.py "$EP" public props.json
          npx remotion render src/index.ts Explainer out/video.mp4 --props=props.json --concurrency=4 --crf=18
          npx remotion still src/index.ts Thumbnail out/thumb.png --props=props.json || true
          [ -f out/thumb.png ] && ffmpeg -y -loglevel error -i out/thumb.png -q:v 3 out/thumb.jpg
          N="scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p"
          A="aresample=48000,aformat=channel_layouts=stereo"
          ffmpeg -y -loglevel error -i brand/intro.mp4 -i out/video.mp4 -i brand/outro.mp4 -filter_complex \
            "[0:v]$N[v0];[1:v]$N[v1];[2:v]$N[v2];[0:a]$A[a0];[1:a]$A[a1];[2:a]$A[a2];[v0][a0][v1][a1][v2][a2]concat=n=3:v=1:a=1[v][a]" \
            -map "[v]" -map "[a]" -c:v libx264 -crf 19 -preset medium -c:a aac -b:a 192k -movflags +faststart out/video_final.mp4
      - name: Upload to YouTube
        if: steps.ep.outputs.ep != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          COURSE_PUBLISH_NOW: ${{ inputs.publish_now && '1' || '0' }}
        run: |
          EP=${{ steps.ep.outputs.ep }}
          python -m pipeline.course upload "$EP" "blend/studio/explainer/episodes/$EP" blend/studio/explainer/out
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/course.json && git commit -qm "Course: uploaded $EP [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q && exit 0; sleep $((i*5)); done
      - name: Email the owner if the reviewer could not fix the chapter
        if: failure() && steps.review.outcome == 'failure'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          { echo "The reviewer AI found mistakes in **${{ steps.ep.outputs.ep }}** that it could not fix, so this chapter was NOT uploaded."; echo; echo '```'; cat review_failed.txt 2>/dev/null; echo '```'; echo; echo "Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > body.md
          python -m pipeline.course block "${{ steps.ep.outputs.ep }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/course.json && git commit -qm "Course: ${{ steps.ep.outputs.ep }} paused for a fix [skip ci]" && for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q && break; sleep $((i*5)); done
          gh issue create -R ${{ github.repository }} --title "Course chapter needs a fix: ${{ steps.ep.outputs.ep }}" --body-file body.md --assignee ${{ github.repository_owner }} || gh issue create -R ${{ github.repository }} --title "Course chapter needs a fix: ${{ steps.ep.outputs.ep }}" --body-file body.md
      - uses: actions/upload-artifact@v4
        if: always() && steps.ep.outputs.ep != ''
        with:
          name: chapter
          retention-days: 7
          if-no-files-found: ignore
          path: |
            blend/studio/explainer/out/video_final.mp4
            review_log.txt
